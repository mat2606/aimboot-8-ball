name: Gerar APK Android 12

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      # Este projeto nao tem gradlew nem gradle-wrapper.jar.
      # Usamos o Gradle instalado pela action, compativel com AGP 8.6.1.
      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Compilar APK de teste
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MiraBilhar-Android12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
